{% extends "base.html" %}

{% block title %}Contact - Nicholas Johnson{% endblock %}
{% block description %}Connect with Nicholas Johnson on LinkedIn and GitHub.{% endblock %}

{% block main %}
  <article class="post contact-post">
    <header class="single-heading">
      <div class="post-title">
        <h2>Contact</h2>
      </div>
    </header>
    <div class="contact-directory" aria-label="Professional profiles">
      <a
        class="contact-profile"
        href="https://www.linkedin.com/in/johnsonlink/"
        target="_blank"
        rel="noopener"
        aria-label="Open Nicholas Johnson's LinkedIn profile">
        <span class="contact-profile-icon contact-profile-linkedin" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M6.94 8.5H3.56V19.4h3.38V8.5ZM5.25 3.08a1.96 1.96 0 1 0 0 3.92 1.96 1.96 0 0 0 0-3.92ZM19.4 13.15c0-3.28-1.75-4.8-4.09-4.8-1.88 0-2.73 1.04-3.2 1.77V8.5H8.73v10.9h3.38v-5.4c0-1.43.27-2.82 2.05-2.82 1.75 0 1.77 1.64 1.77 2.91v5.31h3.38l.09-6.25Z"/>
          </svg>
        </span>
        <span class="contact-profile-copy">
          <strong>LinkedIn</strong>
          <small>linkedin.com/in/johnsonlink</small>
        </span>
        <span class="contact-profile-arrow" aria-hidden="true">↗</span>
      </a>

      <a
        class="contact-profile"
        href="https://github.com/nej296"
        target="_blank"
        rel="noopener"
        aria-label="Open Nicholas Johnson's GitHub profile">
        <span class="contact-profile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path fill-rule="evenodd" d="M12 2.5a9.75 9.75 0 0 0-3.08 19c.49.09.67-.21.67-.47v-1.86c-2.73.59-3.3-1.16-3.3-1.16-.45-1.14-1.09-1.44-1.09-1.44-.89-.61.07-.6.07-.6.98.07 1.5 1.01 1.5 1.01.88 1.5 2.3 1.07 2.86.82.09-.64.34-1.07.62-1.32-2.18-.25-4.47-1.09-4.47-4.82 0-1.07.38-1.94 1.01-2.62-.1-.25-.44-1.24.1-2.58 0 0 .82-.26 2.68 1a9.26 9.26 0 0 1 4.88 0c1.86-1.26 2.68-1 2.68-1 .54 1.34.2 2.33.1 2.58.63.68 1.01 1.55 1.01 2.62 0 3.74-2.3 4.57-4.48 4.81.35.3.66.9.66 1.82v2.7c0 .26.18.57.67.47A9.75 9.75 0 0 0 12 2.5Z" clip-rule="evenodd"/>

        </span>
        <span class="contact-profile-copy">
          <strong>GitHub</strong>
          <small>github.com/nej296</small>
        </span>
        <span class="contact-profile-arrow" aria-hidden="true">↗</span>
      </a>
    </div>
  </article>
{% endblock %}
