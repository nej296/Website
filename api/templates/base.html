<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>{% block title %}Nicholas Johnson - Computational Neuroscience{% endblock %}</title>
  <meta
    name="description"
    content="{% block description %}Nicholas Johnson is a George Mason University neuroscience senior focused on computational neuroscience, neuroinformatics, neuronal morphology, and NEURON modeling.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;700;800;900&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/portfolio.css">
</head>
<body>
  <header id="site-header">
    <h1><a href="/">Nicholas Johnson</a></h1>
    <nav class="primary-nav" aria-label="Primary navigation">
      <ul>
        <li><a href="/research" class="{% if request.path in ['/research', '/research.html'] %}active{% endif %}">Research</a></li>
        <li><a href="/project-demos" class="{% if request.path in ['/project-demos', '/project-demos.html', '/projects', '/demos'] %}active{% endif %}">Project Demos</a></li>
        <li><a href="/contact" class="{% if request.path in ['/contact', '/contact.html'] %}active{% endif %}">Contact</a></li>
      </ul>
    </nav>
  </header>

  <div id="wrapper">
    <aside id="sidebar" aria-label="Portfolio summary">
      <section class="intro" id="top">
        <a class="portrait" href="/" aria-label="Go to Nicholas Johnson landing page">
          <img src="/static/nicholas-contact-headshot-black-2026.png" alt="Nicholas Johnson portrait">
        </a>
        <header>
          <h2>Nicholas Johnson</h2>
          <p>George Mason University, Neuroscience Senior</p>
        </header>
      </section>
    </aside>

    <main id="main">
      {% block main %}{% endblock %}
    </main>
  </div>
</body>
</html>
